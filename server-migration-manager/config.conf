#!/usr/bin/env bash
#===============================================================================
# SERVER MIGRATION MANAGER v1.1.1 — Configuration
# JOJO BACKUPER · @B_KHANEMAN
#===============================================================================

SMM_VERSION="1.3.7"

# Backup storage (local on old server)
BACKUP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/backups"
METADATA_DIR=""  # set dynamically per backup session

# Compression: zstd (recommended) | gzip | xz
COMPRESSION="zstd"
ZSTD_LEVEL="3"
ZSTD_THREADS="0"   # 0 = auto (all cores)

# Remote / SSH defaults
REMOTE_HOST=""
REMOTE_USER="root"
REMOTE_PORT="22"
SSH_PORT="22"
REMOTE_PATH="/backup"
SSH_KEY=""
SSH_PASSWORD=""
AUTH_METHOD="key"  # key | password

# Retention
KEEP_BACKUPS="3"

# Logging
LOG_DIR="/var/log/server-migration"
PROJECT_LOG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/logs"
LOCK_FILE="/var/run/smm-migration.lock"

# Paths included in full filesystem backup
BACKUP_INCLUDE=(
    /etc
    /home
    /root
    /opt
    /usr
    /var
    /srv
    /boot
)

# Paths excluded from filesystem backup
BACKUP_EXCLUDE=(
    /proc
    /sys
    /dev
    /run
    /tmp
    /mnt
    /media
    /lost+found
    /var/tmp
    /var/cache/apt/archives
    /var/lib/docker/overlay2
    /var/lib/docker/image
    /var/lib/containerd
    /snap
    /var/swap
    /swapfile
    /swap.img
)

# Minimum free disk space required (GB) before backup
MIN_FREE_SPACE_GB="10"

# Transfer
RSYNC_OPTS="-avz --progress --partial --inplace --compress-level=6"
TRANSFER_TIMEOUT="0"       # seconds, 0 = no timeout
BANDWIDTH_LIMIT_KB="0"     # rsync --bwlimit KB/s, 0 = unlimited
SPLIT_SIZE_MB="0"          # split archive into chunks (0 = disabled), e.g. 2048

# Safety
REQUIRE_CONFIRMATION="yes"
VERIFY_CHECKSUM="yes"
DRY_RUN="no"
CREATE_RESTORE_POINT="yes"   # snapshot critical configs on NEW server before overwrite

# Encryption (optional) — set ENCRYPT_BACKUP=yes and ENCRYPT_PASSPHRASE or ENCRYPT_GPG_RECIPIENT
ENCRYPT_BACKUP="no"
ENCRYPT_METHOD="gpg"         # gpg | openssl
ENCRYPT_PASSPHRASE=""
ENCRYPT_GPG_RECIPIENT=""

KEEP_PLAINTEXT_AFTER_ENCRYPT="no"

# Notifications (optional)
NOTIFY_ENABLED="no"
NOTIFY_WEBHOOK_URL=""        # Discord/Slack/generic webhook
NOTIFY_TELEGRAM_BOT_TOKEN=""
NOTIFY_TELEGRAM_CHAT_ID=""

# Restore behavior (SAFE defaults for VPS — avoid brick / 100% CPU lockups)
REBOOT_AFTER_RESTORE="no"          # never auto-reboot after restore (was bricking VPS)
RESTORE_BOOT="no"                  # NEVER overwrite /boot (wrong kernel = won't boot)
RESTORE_USR="no"                   # full /usr clone often breaks new OS; enable only if same release
RESTORE_FSTAB="no"                 # keep NEW server disk UUIDs
KEEP_TARGET_NETWORK="yes"          # keep NEW server netplan/IP (old netplan = no SSH)
RESTORE_NETWORK="no"               # do not apply old server netplan by default
RESTORE_FIREWALL="no"              # old firewall can lock you out of SSH
RESTORE_DOCKER="yes"
RESTORE_DOCKER_IMAGES="no"         # loading all images pegs CPU/RAM — pull later with compose
RESTORE_DOCKER_AUTO_START="no"     # do not compose-up everything during restore
RESTORE_DATABASES="yes"
RESTORE_SSL="yes"
RESTORE_TUNNELS="no"               # WireGuard/tunnels can break routing on new IP
RESTORE_WEB="yes"
RESTORE_MAIL="no"                  # mail stacks are heavy; enable if needed
RESTORE_SECURITY="no"              # old sshd_config/fail2ban can lock SSH access
RESTORE_SSHD_CONFIG="no"           # never overwrite sshd_config unless explicitly yes
RESTORE_PACKAGES="yes"
CLEAN_CLOUD_INIT="yes"
PRESERVE_NEW_SSH_HOST_KEYS="yes"  # avoid SSH fingerprint storms if desired = no to clone keys too
RESTORE_NICE="19"                  # lower CPU priority during extract/rsync
RESTORE_IONICE_CLASS="3"           # idle I/O class
# Set SAFE_RESTORE_GUARDS=no only if you fully understand the risks
SAFE_RESTORE_GUARDS="yes"

# Post-check
POSTCHECK_HTTP_URLS=""       # space-separated URLs to curl after migration
POSTCHECK_TCP_PORTS="22 80 443"
